name: CD - techbridge-landing

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Astro Landing Page
        run: npm run build

      - name: ☁️ Upload Landing to AWS Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AWS_LIGHTSAIL_IP }}
          username: ${{ secrets.AWS_LIGHTSAIL_USER }}
          key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY }}
          port: 22
          source: "dist/*" 
          target: "/home/ubuntu/app/frontend-dist/landing"
          strip_components: 1